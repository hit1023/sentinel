# hit-linux-ids 設定ファイル
# ---------------------------------------------------------

# 監視ループの間隔（秒）
interval_seconds: 60

# --- 中央WebUIへの送信（マルチホスト監視） ---
# このエージェントが検知したアラート・状態スナップショットを、
# 司令塔WebUI(hit-linux-ids-webui、通常はgate 1台だけで稼働)へHTTPで送信する。
#
# 重要: webui_url / ingest_token / host_label はホストごとに値が異なるのに
# config.yaml自体はgit管理下で全ホスト共通デプロイされる（CIが
# `git reset --hard`するため、ホストで直接編集しても次回デプロイで消える）。
# そのため実際の値はこの下のプレースホルダーではなく、各ホストの
# .env（gitignore対象、docker composeが自動読み込み）で
# CENTRAL_WEBUI_URL / CENTRAL_INGEST_TOKEN / CENTRAL_HOST_LABEL として
# 設定すること。config.yaml側の値は環境変数が無い場合のフォールバックに過ぎない。
central:
  enabled: true
  webui_url: ""   # 例(.envに): CENTRAL_WEBUI_URL=http://192.168.0.18:8877
  ingest_token: ""  # 例(.envに): CENTRAL_INGEST_TOKEN=xxxx
  host_label: ""    # 例(.envに): CENTRAL_HOST_LABEL=h-1 （空ならOSのホスト名を自動使用）
  timeout_seconds: 5

# --- 認証ログ監視 ---
auth_watch:
  enabled: true
  # 実ホスト上のパスをそのまま書く。Docker運用時のみHITIDS_LOG_PREFIX(既定/hostlogs)が
  # 自動的に前置され、docker-composeでread-onlyマウントされた場所を見に行く
  # （ネイティブ運用のsystemd/launchdではプレフィックスなし=このパスそのものを見る）。
  log_paths:
    - /var/log/auth.log
  # journalctl方式（rsyslogがauth.logを吐かないディストロ用）。使う場合はtrueにし、
  # docker-composeで /var/log/journal を read-only マウントしてください。
  # ネイティブ運用のLinuxでは、こちらをtrueにするのを推奨(auth.log非搭載ディストロが多いため)。
  use_journalctl: false
  # 同一IPからの失敗ログイン、この回数を超えたらアラート
  fail_threshold: 5
  # 上記をカウントする時間窓（秒）
  fail_window_seconds: 300
  # 成功ログインも通知するか（新規ログイン検知用）
  notify_on_success: true
  # このユーザー名への失敗ログインは、ブルートフォース閾値に達していなくても
  # 1回目から即座にWARNING通知する（root等、狙われやすく実在するユーザー名は
  # 「invalid user」判定にならないため、通常は閾値到達までログに埋もれてしまう）
  sensitive_users:
    - root
    - admin
    - administrator
    - ubuntu
  # 発信元IPの国・都市・逆引きドメインをip-api.com(APIキー不要の無料枠)で調べ、
  # アラートメッセージに付与する。さらに、これまで見たことのない国からの
  # ログイン成功は閾値なしで即CRITICAL通知する（初回起動後に最初に見た国は
  # ベースラインとして静かに記録するだけで、それ以降の新しい国だけが対象）。
  # 社内LAN(プライベートIP)からのアクセスは常にスキップされる。
  geoip_enabled: true

# --- ファイル整合性監視（簡易AIDE） ---
integrity_watch:
  enabled: true
  # 実ホスト上のパスをそのまま書く。Docker運用時のみHITIDS_FS_PREFIX(既定/hostfs)が
  # 自動的に前置され、docker-composeでread-onlyマウントされたホスト全体を見に行く
  # （ネイティブ運用のsystemd/launchdではプレフィックスなし=このパスそのものを見る）。
  # globパターン（*/?/[]）も使用可（例: /home/*/.ssh でroot以外の全ユーザーを対象化）
  watch_paths:
    - /etc
    - /root/.ssh
    - /home/*/.ssh
    - /etc/nginx
    - /etc/docker
  # 除外パターン（fnmatch形式、フルパスに対して判定）
  exclude_patterns:
    - "*/etc/mtab"
    - "*/etc/adjtime"
    - "*/etc/resolv.conf"
    - "*.log"
    - "*.tmp"
    # CUPSが印刷購読の状態管理のため頻繁に書き換える運用ファイル（改ざんではない）
    - "*/cups/subscriptions.conf*"
    # fail2banのフィルター定義（パッケージ更新時に正規に追加/変更される設定ファイル群）
    - "*/fail2ban/filter.d/*"
    - "*/fail2ban/action.d/*"
    - "*/fail2ban/jail.d/*"
  # ここに一致するパスは、新規作成・削除であっても（通常はwarning止まりのところ）
  # 即座にcriticalとして扱う。SSH公開鍵は不正ログインの前兆として特に重大なため。
  critical_patterns:
    - "*/.ssh/*"
  # ベースライン（初回スキャン結果）の保存先。既存があれば差分検知、なければ新規作成のみ。
  baseline_path: /data/integrity_baseline.json

# --- 外向き通信の異常検知 ---
# LAN内(プライベートIP)への通信は監視対象外。それ以外の宛先への確立済み通信のうち、
# 既知ポート以外・既知の攻撃ツールが使うポートへの通信を検知する。
outbound_watch:
  enabled: true
  # このポートへの外向き通信は正常とみなし、通知しない（Web/DNS/NTP/SSH/DoH等）
  known_outbound_ports:
    - 80
    - 443
    - 53
    - 123   # NTP
    - 22    # SSH（他ホストへの踏み台的アクセス等、正規利用も多いため既定で許可）
    - 853   # DNS over TLS
  # 既知の攻撃ツール・C2フレームワークがよく使うポート。検知したら閾値なしで即CRITICAL。
  suspicious_ports:
    - 4444   # Metasploit既定
    - 1337
    - 6666
    - 6667   # IRC (ボットネットC2の定番)
    - 31337
    - 12345
    - 54321

# --- プロセス／ネットワーク異常検知 ---
procnet_watch:
  enabled: true
  # 既知のリスニングポート（これ以外の新規LISTENを検知したら通知）
  known_listen_ports:
    - 22    # SSH
    - 53    # technitium-dns
    - 80    # nginx-proxy-manager
    - 81    # NPM管理画面
    - 443
    - 5355  # technitium-dns (mDNS)
    - 5380  # technitium-dns 管理画面
    - 8090  # pm-tool
    - 8092  # hit-switchbot-webui
    - 8877  # hit-linux-ids WebUI（自分自身）
    - 9001  # portainer_agent
    - 10050 # zabbix_agent2
    - 51820 # wg-easy VPN (UDP)
    - 51821 # wg-easy 管理画面
    - 51822 # wg-easy VPN (ホスト側マッピングポート)
  # プロセス名のホワイトリスト（新規に現れた未知プロセスのうち、ここに無いものだけ通知）
  # 完全一致ではなく部分一致で判定
  known_process_keywords:
    - dockerd
    - containerd
    - sshd
    - systemd
    - nginx
    - wg-easy
    - node
    - portainer
    - technitium
    - wireguard
    - cron
    - rsyslog
    - kworker
    - ksoftirqd
    - zabbix
    - uvicorn
    - python
    - jbd2
    - irq
    - rpc.
  # 高CPU使用率プロセスの通知しきい値（%、5秒平均）
  cpu_alert_percent: 90

# --- 通知先 ---
notify:
  # pushman/mailman等、既存の通知APIへPOSTする場合のWebhook URL
  # 例: https://pushman.s-quad.com/api/notify （実際のエンドポイントに合わせて変更）
  webhook_url: ""
  webhook_token: ""
  # 常にローカルログファイルにも書き出す
  log_file: /data/alerts.log

# --- AIトリアージ（Cloudflare AI Gateway経由） ---
# CRITICAL/WARNINGアラート発生時、生ログをLLMに渡して日本語1〜2文の
# トリアージコメント（何が起きたか・緊急度・次の一手）を自動生成しフィードに添える。
ai_triage:
  enabled: true
  # このセキュリティレベルのアラートのみAIトリアージする（INFO等は対象外、コスト抑制のため）
  trigger_severities:
    - critical
    - warning
  # Cloudflareダッシュボード → AI → AI Gateway で作成したGatewayの情報
  cloudflare_account_id: "a02903a62c568fcf8fd62fc7bef36aa0"
  cloudflare_gateway_id: "sentinel"
  # Workers AIのモデル名（軽量・高速なものを推奨）
  model: "@cf/meta/llama-3.1-8b-instruct-fast"
  # Workers AI権限を持つCloudflare APIトークン。
  # ここに直書きせず、環境変数 CF_AI_GATEWAY_TOKEN での指定を推奨
  # （docker-compose.ymlが .env を自動読み込みする）。
  api_token: ""
  # 1回あたりのタイムアウト秒数（超過時は静かに諦め、通知自体は止めない）
  timeout_seconds: 8
  # trueにすると、AIが「脅威ではない」と判定したCRITICAL/WARNINGを
  # 自動的にINFOへ格下げする（統計・フラッシュ演出・Webhook通知の対象外になる）。
  # レコード自体は削除せず ai_dismissed:true として残るため、後から見返せる。
  # AIの誤判定で見逃しが起きるリスクを許容できる場合のみtrueにすること。
  auto_dismiss_non_threats: true
