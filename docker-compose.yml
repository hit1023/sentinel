services:
  # 監視エージェント本体。全ホストで常に起動する（デフォルトプロファイル）。
  hit-linux-ids:
    build: .
    container_name: hit-linux-ids
    restart: unless-stopped
    # ホストのプロセス空間・ネットワーク空間を共有し、ホスト全体を監視対象にする
    pid: host
    network_mode: host
    cap_add:
      - SYS_PTRACE
    environment:
      # AIトリアージ用トークン。プレーンテキストでconfig.yamlに書きたくない場合は
      # このディレクトリに .env ファイルを作り CF_AI_GATEWAY_TOKEN=xxxx と書く
      # （docker composeが自動読み込みする、.gitignore済み）
      - CF_AI_GATEWAY_TOKEN=${CF_AI_GATEWAY_TOKEN:-}
      # 中央WebUI(hit-linux-ids-webui)へアラートを送るための共有トークン。
      # WebUI側のINGEST_TOKENと必ず一致させること。
      - CENTRAL_INGEST_TOKEN=${CENTRAL_INGEST_TOKEN:-}
      # 司令塔WebUIのURL。ホストごとに.envで指定する
      # （gateなら http://localhost:8877 、それ以外はgateのLAN IP）。
      - CENTRAL_WEBUI_URL=${CENTRAL_WEBUI_URL:-}
      # ダッシュボード上でのホスト表示名。空ならOSのホスト名を自動使用。
      - CENTRAL_HOST_LABEL=${CENTRAL_HOST_LABEL:-}
    volumes:
      - ./app/config.yaml:/app/config.yaml:ro
      - ./data:/data
      # 認証ログ（rsyslog系。journalctl方式を使う場合はconfigでuse_journalctl: trueにし、
      # 下のjournalマウントを有効化してください）
      - /var/log/auth.log:/hostlogs/auth.log:ro
      # - /var/log/journal:/var/log/journal:ro
      # ファイル整合性監視用にホストのファイルシステムを読み取り専用でマウント
      - /:/hostfs:ro

  # 司令塔WebUI。複数ホストのagentからのアラートを集約する側なので、
  # 通常は1台（例: gate）だけで動かせばよい。
  # 起動するには `docker compose --profile server up -d --build` のように
  # --profile server を明示する（付けなければagentだけが起動する）。
  hit-linux-ids-webui:
    build: ./webui
    container_name: hit-linux-ids-webui
    restart: unless-stopped
    profiles:
      - server
    ports:
      - "8877:8000"
    environment:
      - IDS_DATA_DIR=/data
      # このトークンをagent側のCENTRAL_INGEST_TOKENと一致させる
      - INGEST_TOKEN=${CENTRAL_INGEST_TOKEN:-}
    volumes:
      - ./data:/data
